name: Build Android APK

on:
  push:
    branches: [ "main", "agent/**", "feature/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat source_chunks/gpchunk_* > GastoPay.zip.b64.rebuilt
          base64 -d GastoPay.zip.b64.rebuilt > GastoPay.zip
          unzip -t GastoPay.zip
          unzip -o GastoPay.zip

      - name: Apply Android bridge fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('GastoPay/app/src/main/java/com/gabriel/gastopay/MainActivity.java')
          s = main.read_text()
          old = 'boolean listener = NotificationManager.getEnabledListenerPackages(this).contains(getPackageName());'
          new = 'String enabledListeners = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");\n        boolean listener = enabledListeners != null && enabledListeners.contains(getPackageName());'
          if old in s:
              s = s.replace(old, new)
          main.write_text(s)

          manifest = Path('GastoPay/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          perm = '    <uses-permission android:name="android.permission.WRITE_SYNC_SETTINGS" />\n'
          if 'android.permission.WRITE_SYNC_SETTINGS' not in m:
              m = m.replace('    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n', '    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n' + perm)
          manifest.write_text(m)
          PY

          cat > GastoPay/app/src/main/java/com/gabriel/gastopay/CalendarBridge.java <<'JAVA'
          package com.gabriel.gastopay;

          import android.Manifest;
          import android.accounts.Account;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.CalendarContract;

          import java.time.LocalDate;
          import java.util.TimeZone;

          public final class CalendarBridge {
              private CalendarBridge() {}

              public static final class Target {
                  public final long id;
                  public final String accountName;
                  public final String accountType;
                  public final String displayName;

                  Target(long id, String accountName, String accountType, String displayName) {
                      this.id = id;
                      this.accountName = accountName;
                      this.accountType = accountType;
                      this.displayName = displayName;
                  }
              }

              public static boolean hasPermission(Context context) {
                  return context.checkSelfPermission(Manifest.permission.READ_CALENDAR) == PackageManager.PERMISSION_GRANTED
                          && context.checkSelfPermission(Manifest.permission.WRITE_CALENDAR) == PackageManager.PERMISSION_GRANTED;
              }

              public static Target findWritableGoogleCalendarTarget(Context context) {
                  if (!hasPermission(context)) return null;

                  String[] projection = {
                          CalendarContract.Calendars._ID,
                          CalendarContract.Calendars.ACCOUNT_NAME,
                          CalendarContract.Calendars.ACCOUNT_TYPE,
                          CalendarContract.Calendars.CALENDAR_DISPLAY_NAME,
                          CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL,
                          CalendarContract.Calendars.VISIBLE,
                          CalendarContract.Calendars.IS_PRIMARY,
                          CalendarContract.Calendars.SYNC_EVENTS
                  };

                  try (Cursor c = context.getContentResolver().query(
                          CalendarContract.Calendars.CONTENT_URI,
                          projection,
                          CalendarContract.Calendars.ACCOUNT_TYPE + "=? AND " +
                                  CalendarContract.Calendars.VISIBLE + "=1 AND " +
                                  CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL + ">=?",
                          new String[]{"com.google", String.valueOf(CalendarContract.Calendars.CAL_ACCESS_CONTRIBUTOR)},
                          CalendarContract.Calendars.IS_PRIMARY + " DESC, " + CalendarContract.Calendars.SYNC_EVENTS + " DESC")) {
                      if (c == null) return null;
                      Target fallback = null;
                      while (c.moveToNext()) {
                          long id = c.getLong(0);
                          String accountName = c.getString(1);
                          String accountType = c.getString(2);
                          String displayName = c.getString(3);
                          int primary = c.getInt(6);
                          int syncEvents = c.getInt(7);
                          Target t = new Target(id, accountName, accountType, displayName);
                          if (fallback == null) fallback = t;
                          if (primary == 1 && syncEvents == 1) return t;
                      }
                      return fallback;
                  } catch (Exception e) {
                      return null;
                  }
              }

              public static Long findWritableGoogleCalendar(Context context) {
                  Target t = findWritableGoogleCalendarTarget(context);
                  return t == null ? null : t.id;
              }

              public static String getSelectedCalendarLabel(Context context) {
                  Target t = findWritableGoogleCalendarTarget(context);
                  if (t == null) return null;
                  String name = t.displayName == null || t.displayName.trim().isEmpty() ? "Google Agenda" : t.displayName.trim();
                  String account = t.accountName == null ? "" : t.accountName.trim();
                  return account.isEmpty() ? name : name + " • " + account;
              }

              public static boolean enqueue(Context context, TransactionRecord record, BudgetStore store) {
                  Target target = findWritableGoogleCalendarTarget(context);
                  if (target == null) return false;

                  long start = record.timestamp;
                  long end = start + 60_000L;
                  String action = record.type == TransactionType.PURCHASE ? "COMPRA" : "ESTORNO";
                  String title = "[GastoPay] " + action + " " + MoneyUtils.formatBrl(record.amountCents) + " — " + record.merchant;
                  LocalDate nextPayment = LocalDate.ofEpochDay(store.getNextPaymentEpochDay());

                  String description = "GASTOPAY_PENDING=1\n" +
                          "version=2\n" +
                          "transaction_id=" + sanitize(record.id) + "\n" +
                          "type=" + record.type.name() + "\n" +
                          "amount_cents=" + record.amountCents + "\n" +
                          "amount_brl=" + MoneyUtils.decimalBrl(record.amountCents) + "\n" +
                          "merchant=" + sanitize(record.merchant) + "\n" +
                          "remaining_cents=" + record.remainingAfterCents + "\n" +
                          "remaining_brl=" + MoneyUtils.decimalBrl(record.remainingAfterCents) + "\n" +
                          "spent_cents=" + record.spentAfterCents + "\n" +
                          "spent_brl=" + MoneyUtils.decimalBrl(record.spentAfterCents) + "\n" +
                          "next_payment=" + nextPayment + "\n" +
                          "source=" + sanitize(record.source) + "\n";

                  ContentValues values = new ContentValues();
                  values.put(CalendarContract.Events.CALENDAR_ID, target.id);
                  values.put(CalendarContract.Events.DTSTART, start);
                  values.put(CalendarContract.Events.DTEND, end);
                  values.put(CalendarContract.Events.EVENT_TIMEZONE, TimeZone.getDefault().getID());
                  values.put(CalendarContract.Events.TITLE, title);
                  values.put(CalendarContract.Events.DESCRIPTION, description);
                  values.put(CalendarContract.Events.AVAILABILITY, CalendarContract.Events.AVAILABILITY_FREE);
                  values.put(CalendarContract.Events.ACCESS_LEVEL, CalendarContract.Events.ACCESS_PRIVATE);
                  values.put(CalendarContract.Events.HAS_ALARM, 0);

                  try {
                      ContentResolver cr = context.getContentResolver();
                      Uri inserted = cr.insert(CalendarContract.Events.CONTENT_URI, values);
                      if (inserted == null) return false;

                      if (target.accountName != null && !target.accountName.isEmpty()
                              && target.accountType != null && !target.accountType.isEmpty()) {
                          try {
                              Account account = new Account(target.accountName, target.accountType);
                              Bundle extras = new Bundle();
                              extras.putBoolean(ContentResolver.SYNC_EXTRAS_MANUAL, true);
                              extras.putBoolean(ContentResolver.SYNC_EXTRAS_EXPEDITED, true);
                              ContentResolver.requestSync(account, CalendarContract.AUTHORITY, extras);
                          } catch (Exception ignored) {}
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static String sanitize(String s) {
                  if (s == null) return "";
                  return s.replace("\n", " ").replace("\r", " ").trim();
              }
          }
          JAVA

          python - <<'PY'
          from pathlib import Path
          p = Path('GastoPay/app/src/main/java/com/gabriel/gastopay/MainActivity.java')
          s = p.read_text()
          old = '"\\n• Google Agenda: " + (calendarPerm ? (calId != null ? "PRONTO" : "sem agenda gravável") : "PENDENTE") +'
          new = '"\\n• Google Agenda: " + (calendarPerm ? (calId != null ? "PRONTO — " + CalendarBridge.getSelectedCalendarLabel(this) : "sem agenda Google gravável") : "PENDENTE") +'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: GastoPay
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: GastoPay
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GastoPay-debug-apk
          path: GastoPay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
