name: Build Android APK

on:
  push:
    branches: [ "main", "agent/**", "feature/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat source_chunks/gpchunk_* > GastoPay.zip.b64.rebuilt
          base64 -d GastoPay.zip.b64.rebuilt > GastoPay.zip
          unzip -t GastoPay.zip
          unzip -o GastoPay.zip

      - name: Apply Calendar provider compile fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('GastoPay/app/src/main/java/com/gabriel/gastopay/CalendarBridge.java')
          s = p.read_text()
          old = 'values.put(CalendarContract.Events.CALENDAR_ID, calendarId);'
          new = 'values.put(CalendarContract.Events.CALENDAR_ID, String.valueOf(calendarId));'
          if old not in s and new not in s:
              raise SystemExit('Expected CalendarBridge line not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: GastoPay
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: GastoPay
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GastoPay-debug-apk
          path: GastoPay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
